name: Orbio
description: 'Orbio Earth is a climate-tech company (founded 2021; Dover, Delaware, USA and Cologne, Germany)
  that turns open satellite data into industrial methane intelligence for the energy sector. Its platform
  detects, quantifies, and tracks methane emissions from oil-and-gas infrastructure globally at asset level
  with a roughly 5-day revisit rate, using multispectral imagery (Sentinel-2, Landsat 8/9, EMIT) and machine
  learning, plus Bayesian uncertainty estimation. Customers — oil-and-gas operators and private-equity firms —
  use it for super-emitter identification, historical trend and root-cause analysis, and compliance with
  emerging methane regulation. Platform access is offered via the web application or a sales-gated data API
  integration; there is no public self-serve developer portal, OpenAPI, or SDK. Orbio also publishes the
  open-source Project Eucalyptus methane-detection pipelines on GitHub for research use.'
